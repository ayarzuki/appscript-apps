<!-- Views.html — HTML Templates for All Application Screens and Modals -->

<!-- Loading Screen Template -->
<template id="tpl-loading">
  <div class="empty-state">
    <div class="spinner"></div>
    <p style="margin-top: 14px;">Memuat data...</p>
  </div>
</template>

<!-- Access Issue Screen Template -->
<template id="tpl-access-issue">
  <div class="card" style="max-width: 520px; margin: 40px auto; text-align: center;">
    <div class="empty-icon" id="issue-icon">🔒</div>
    <h2 class="card-title" id="issue-title" style="justify-content: center; margin-bottom: 8px;">Akses Ditolak</h2>
    <p id="issue-message" style="color: var(--text-muted); margin-bottom: 12px;"></p>
    <div id="issue-email" style="font-size: 13px; font-weight: 500; color: var(--text); margin-bottom: 12px;"></div>
    <p id="issue-hint" style="font-size: 13px; color: var(--text-muted); margin-bottom: 16px;"></p>
    <div style="margin-top: 16px;">
      <button type="button" id="btn-issue-diag" class="btn btn-secondary">Tampilkan Diagnostik</button>
    </div>
    <pre id="issue-diag" class="hidden" style="margin-top: 16px; text-align: left; background: #1e1e1e; color: #d4d4d4; padding: 12px; border-radius: 6px; font-size: 12px; overflow-x: auto; max-height: 250px; white-space: pre-wrap; word-break: break-all;"></pre>
  </div>
</template>

<!-- Database Not Ready Screen Template -->
<template id="tpl-db-not-ready">
  <div class="card" style="max-width: 540px; margin: 40px auto; text-align: center;">
    <div class="empty-icon">⚙️</div>
    <h2 class="card-title" style="justify-content: center; margin-bottom: 8px;">Database Belum Siap</h2>
    <p style="color: var(--text-muted); margin-bottom: 12px;">
      Spreadsheet database belum dikonfigurasi pada sistem ini.
    </p>
    <p id="dbnr-email" style="font-size: 13px; font-weight: 500; color: var(--text-muted); margin-bottom: 16px;">
      Email terdeteksi: tidak terdeteksi
    </p>
    <div style="text-align: left; background: var(--bg-surface, #f8f9fa); border: 1px solid var(--border-color, #e5e7eb); border-radius: 6px; padding: 12px 16px; margin-bottom: 16px; font-size: 13px;">
      <div style="font-weight: 600; margin-bottom: 6px;">Langkah inisialisasi:</div>
      <ol style="margin: 0; padding-left: 20px; line-height: 1.6;">
        <li>Buka editor Apps Script</li>
        <li>Jalankan fungsi <code>setupDatabase()</code></li>
        <li>Jalankan <code>seedMasterData()</code></li>
      </ol>
    </div>
    <div style="margin-top: 16px;">
      <button type="button" id="btn-dbnr-diag" class="btn btn-secondary">Tampilkan Diagnostik</button>
    </div>
    <pre id="dbnr-diag" class="hidden" style="margin-top: 16px; text-align: left; background: #1e1e1e; color: #d4d4d4; padding: 12px; border-radius: 6px; font-size: 12px; overflow-x: auto; max-height: 250px; white-space: pre-wrap; word-break: break-all;"></pre>
  </div>
</template>

<!-- 1. Beranda (Dashboard Home) -->
<template id="tpl-beranda">
  <div class="view-beranda">
    <div class="content-header">
      <div>
        <h1 class="page-title">Beranda</h1>
        <div class="page-subtitle">Ringkasan aktivitas akademik dan jadwal operasional</div>
      </div>
    </div>

    <!-- Metric Counts -->
    <div class="stats-grid" id="beranda-metrics">
      <div class="stat-card">
        <div class="stat-label">Murid Aktif</div>
        <div class="stat-val" id="count-active-students">-</div>
      </div>
      <div class="stat-card">
        <div class="stat-label">Murid Postponed</div>
        <div class="stat-val" id="count-postponed-students">-</div>
      </div>
      <div class="stat-card">
        <div class="stat-label">Non-Active</div>
        <div class="stat-val" id="count-nonactive-students">-</div>
      </div>
      <div class="stat-card">
        <div class="stat-label">Total Terdaftar</div>
        <div class="stat-val" id="count-total-students">-</div>
      </div>
    </div>

    <div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(320px, 1fr)); gap: 20px;">
      <!-- Today's Sessions -->
      <div class="card">
        <div class="card-title">
          <span>📅 Sesi Kelas Hari Ini</span>
        </div>
        <div id="beranda-today-sessions" class="table-container" style="max-height: 280px;">
          <!-- Populated by script -->
        </div>
      </div>

      <!-- Upcoming Events / Deadlines -->
      <div class="card">
        <div class="card-title">
          <span>⏰ Tenggat 7 Hari Mendatang</span>
        </div>
        <div id="beranda-upcoming-events" class="table-container" style="max-height: 280px;">
          <!-- Populated by script -->
        </div>
      </div>
    </div>

    <!-- Missing Attendance Alert (Compliance) -->
    <div class="card" id="beranda-compliance-card">
      <div class="card-title">
        <span style="color: var(--danger);">⚠️ Kepatuhan Input: Sesi >3 Hari Belum Absensi</span>
      </div>
      <div id="beranda-missing-attendance" class="table-container">
        <!-- Populated by script -->
      </div>
    </div>
  </div>
</template>
