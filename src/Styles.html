<style>
  :root {
    --primary: #2563eb;
    --primary-hover: #1d4ed8;
    --primary-light: #eff6ff;
    --bg-main: #f8fafc;
    --bg-card: #ffffff;
    --text-main: #0f172a;
    --text-muted: #64748b;
    --border: #e2e8f0;
    --border-focus: #3b82f6;
    
    --success: #16a34a;
    --success-bg: #dcfce7;
    --warning: #d97706;
    --warning-bg: #fef3c7;
    --danger: #dc2626;
    --danger-bg: #fee2e2;
    --info: #0284c7;
    --info-bg: #e0f2fe;
    
    --sidebar-width: 240px;
    --header-height: 58px;
    --radius-sm: 4px;
    --radius-md: 8px;
    --radius-lg: 12px;
    --shadow-sm: 0 1px 2px rgba(0, 0, 0, 0.05);
    --shadow-md: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06);
    --shadow-lg: 0 10px 15px -3px rgba(0, 0, 0, 0.1);
    
    --font-sans: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  }

  * {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
  }

  body {
    font-family: var(--font-sans);
    background-color: var(--bg-main);
    color: var(--text-main);
    font-size: 14px;
    line-height: 1.5;
    -webkit-font-smoothing: antialiased;
  }

  /* Full screen splash */
  #app-loading {
    position: fixed;
    top: 0; left: 0; right: 0; bottom: 0;
    background: #ffffff;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 16px;
    z-index: 9999;
  }

  .loading-text {
    font-size: 15px;
    font-weight: 500;
    color: var(--text-muted);
  }

  .spinner {
    width: 36px;
    height: 36px;
    border: 3px solid var(--border);
    border-top-color: var(--primary);
    border-radius: 50%;
    animation: spin 0.8s linear infinite;
  }

  @keyframes spin {
    to { transform: rotate(360deg); }
  }

  .banner {
    background-color: #fef2f2;
    color: #991b1b;
    border-bottom: 1px solid #fecaca;
    padding: 12px 20px;
    font-weight: 500;
    text-align: center;
  }

  .hidden { display: none !important; }

  /* App Layout */
  .app-layout {
    display: flex;
    flex-direction: column;
    height: 100vh;
    overflow: hidden;
  }

  .app-header {
    height: var(--header-height);
    background: var(--bg-card);
    border-bottom: 1px solid var(--border);
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 0 20px;
    flex-shrink: 0;
    z-index: 100;
  }

  .header-left {
    display: flex;
    align-items: center;
    gap: 14px;
  }

  .header-title {
    font-size: 17px;
    font-weight: 700;
    color: var(--primary);
    letter-spacing: -0.2px;
  }

  .btn-icon {
    background: none;
    border: none;
    font-size: 18px;
    cursor: pointer;
    padding: 6px;
    border-radius: var(--radius-sm);
    color: var(--text-main);
  }

  .btn-icon:hover {
    background: var(--bg-main);
  }

  .user-chip {
    display: flex;
    align-items: center;
    gap: 10px;
  }

  .user-avatar {
    width: 32px;
    height: 32px;
    border-radius: 50%;
    background: var(--primary);
    color: #ffffff;
    display: flex;
    align-items: center;
    justify-content: center;
    font-weight: 600;
    font-size: 13px;
  }

  .user-meta {
    display: flex;
    flex-direction: column;
  }

  .user-name {
    font-weight: 600;
    font-size: 13px;
    line-height: 1.2;
  }

  .user-role-badge {
    font-size: 11px;
    color: var(--text-muted);
    font-weight: 500;
  }

  .app-body {
    display: flex;
    flex: 1;
    overflow: hidden;
  }

  /* Sidebar */
  .app-sidebar {
    width: var(--sidebar-width);
    background: var(--bg-card);
    border-right: 1px solid var(--border);
    display: flex;
    flex-direction: column;
    justify-content: space-between;
    padding: 16px 10px;
    flex-shrink: 0;
    overflow-y: auto;
    transition: transform 0.2s ease;
  }

  .nav-links {
    display: flex;
    flex-direction: column;
    gap: 4px;
  }

  .nav-item {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 9px 14px;
    color: var(--text-muted);
    text-decoration: none;
    border-radius: var(--radius-md);
    font-weight: 500;
    font-size: 13.5px;
    transition: all 0.15s ease;
    cursor: pointer;
  }

  .nav-item:hover {
    background: var(--bg-main);
    color: var(--text-main);
  }

  .nav-item.active {
    background: var(--primary-light);
    color: var(--primary);
    font-weight: 600;
  }

  .sidebar-footer {
    padding: 12px 14px 4px 14px;
    font-size: 11px;
    color: var(--text-muted);
    border-top: 1px solid var(--border);
  }

  /* Main Content Area */
  .app-content {
    flex: 1;
    overflow-y: auto;
    padding: 24px;
    background: var(--bg-main);
  }

  .content-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 20px;
    flex-wrap: wrap;
    gap: 12px;
  }

  .page-title {
    font-size: 20px;
    font-weight: 700;
    color: var(--text-main);
  }

  .page-subtitle {
    font-size: 13px;
    color: var(--text-muted);
    margin-top: 2px;
  }

  /* Cards */
  .card {
    background: var(--bg-card);
    border: 1px solid var(--border);
    border-radius: var(--radius-lg);
    box-shadow: var(--shadow-sm);
    padding: 20px;
    margin-bottom: 20px;
  }

  .card-title {
    font-size: 15px;
    font-weight: 600;
    margin-bottom: 14px;
    display: flex;
    justify-content: space-between;
    align-items: center;
  }

  /* Tables */
  .table-container {
    background: var(--bg-card);
    border: 1px solid var(--border);
    border-radius: var(--radius-lg);
    overflow: auto;
    box-shadow: var(--shadow-sm);
  }

  table {
    width: 100%;
    border-collapse: collapse;
    text-align: left;
    font-size: 13.5px;
  }

  thead {
    position: sticky;
    top: 0;
    background: #f1f5f9;
    z-index: 10;
  }

  th {
    padding: 11px 16px;
    font-weight: 600;
    color: var(--text-muted);
    border-bottom: 1px solid var(--border);
    white-space: nowrap;
  }

  td {
    padding: 12px 16px;
    border-bottom: 1px solid var(--border);
    vertical-align: middle;
  }

  tbody tr:nth-child(even) {
    background-color: #fafbfc;
  }

  tbody tr:hover {
    background-color: #f1f5f9;
  }

  /* Badges */
  .badge {
    display: inline-flex;
    align-items: center;
    padding: 3px 8px;
    border-radius: 9999px;
    font-size: 11.5px;
    font-weight: 600;
    line-height: 1;
    white-space: nowrap;
  }

  /* Student status */
  .badge-active { background: var(--success-bg); color: var(--success); }
  .badge-postponed { background: var(--warning-bg); color: var(--warning); }
  .badge-non-active { background: #f1f5f9; color: #475569; }
  .badge-cancel { background: var(--danger-bg); color: var(--danger); }

  /* Class status */
  .badge-class-draft { background: #f1f5f9; color: #475569; }
  .badge-class-active { background: var(--info-bg); color: var(--info); }
  .badge-class-completed { background: var(--success-bg); color: var(--success); }

  /* Attendance status */
  .badge-present { background: var(--success-bg); color: var(--success); }
  .badge-absent { background: var(--danger-bg); color: var(--danger); }
  .badge-excused { background: var(--warning-bg); color: var(--warning); }

  /* Buttons */
  .btn {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 6px;
    padding: 8px 14px;
    border-radius: var(--radius-md);
    font-size: 13px;
    font-weight: 500;
    cursor: pointer;
    border: 1px solid transparent;
    transition: all 0.15s ease;
    text-decoration: none;
  }

  .btn-primary {
    background: var(--primary);
    color: #ffffff;
  }
  .btn-primary:hover { background: var(--primary-hover); }

  .btn-secondary {
    background: #ffffff;
    border-color: var(--border);
    color: var(--text-main);
  }
  .btn-secondary:hover { background: var(--bg-main); }

  .btn-danger {
    background: var(--danger);
    color: #ffffff;
  }
  .btn-danger:hover { background: #b91c1c; }

  .btn-sm {
    padding: 5px 10px;
    font-size: 12px;
  }

  /* Forms & Grid */
  .form-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
    gap: 16px;
  }

  .form-group {
    display: flex;
    flex-direction: column;
    gap: 6px;
  }

  .form-group.full-width {
    grid-column: 1 / -1;
  }

  label {
    font-size: 12.5px;
    font-weight: 600;
    color: var(--text-main);
  }

  input, select, textarea {
    padding: 8px 12px;
    border: 1px solid var(--border);
    border-radius: var(--radius-md);
    font-size: 13.5px;
    background: #ffffff;
    font-family: inherit;
    color: var(--text-main);
  }

  input:focus, select:focus, textarea:focus {
    outline: none;
    border-color: var(--border-focus);
    box-shadow: 0 0 0 2px rgba(37, 99, 235, 0.15);
  }

  .checkbox-group {
    display: flex;
    flex-wrap: wrap;
    gap: 8px 16px;
  }

  .checkbox-group label {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    font-weight: normal;
    cursor: pointer;
  }

  /* Filters toolbar */
  .filters-bar {
    display: flex;
    flex-wrap: wrap;
    gap: 10px;
    align-items: center;
    background: var(--bg-card);
    padding: 12px 16px;
    border-radius: var(--radius-lg);
    border: 1px solid var(--border);
    margin-bottom: 16px;
  }

  /* Modal */
  .modal-root {
    position: fixed;
    top: 0; left: 0; right: 0; bottom: 0;
    background: rgba(15, 23, 42, 0.5);
    display: flex;
    align-items: center;
    justify-content: center;
    z-index: 1000;
    padding: 16px;
  }

  .modal-dialog {
    background: var(--bg-card);
    border-radius: var(--radius-lg);
    width: 100%;
    max-width: 600px;
    max-height: 90vh;
    display: flex;
    flex-direction: column;
    box-shadow: var(--shadow-lg);
    overflow: hidden;
  }

  .modal-dialog.modal-lg { max-width: 850px; }

  .modal-header {
    padding: 16px 20px;
    border-bottom: 1px solid var(--border);
    display: flex;
    justify-content: space-between;
    align-items: center;
  }

  .modal-title {
    font-size: 16px;
    font-weight: 700;
  }

  .modal-body {
    padding: 20px;
    overflow-y: auto;
  }

  .modal-footer {
    padding: 14px 20px;
    border-top: 1px solid var(--border);
    display: flex;
    justify-content: flex-end;
    gap: 10px;
    background: #f8fafc;
  }

  /* Toasts */
  .toast-root {
    position: fixed;
    bottom: 24px;
    right: 24px;
    display: flex;
    flex-direction: column;
    gap: 8px;
    z-index: 2000;
  }

  .toast {
    background: #1e293b;
    color: #ffffff;
    padding: 10px 16px;
    border-radius: var(--radius-md);
    box-shadow: var(--shadow-md);
    font-size: 13px;
    font-weight: 500;
    display: flex;
    align-items: center;
    gap: 8px;
    animation: fadeIn 0.2s ease;
  }

  .toast-success { background: #166534; }
  .toast-error { background: #991b1b; }

  @keyframes fadeIn {
    from { opacity: 0; transform: translateY(6px); }
    to { opacity: 1; transform: translateY(0); }
  }

  /* Dashboard metric cards & charts */
  .stats-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
    gap: 14px;
    margin-bottom: 20px;
  }

  .stat-card {
    background: var(--bg-card);
    border: 1px solid var(--border);
    border-radius: var(--radius-lg);
    padding: 16px;
    box-shadow: var(--shadow-sm);
  }

  .stat-label {
    font-size: 12px;
    color: var(--text-muted);
    font-weight: 600;
    text-transform: uppercase;
  }

  .stat-val {
    font-size: 24px;
    font-weight: 700;
    margin-top: 4px;
    color: var(--text-main);
  }

  .bar-chart-row {
    display: flex;
    align-items: center;
    gap: 12px;
    margin-bottom: 10px;
  }

  .bar-chart-label {
    width: 80px;
    font-size: 12.5px;
    font-weight: 500;
  }

  .bar-chart-track {
    flex: 1;
    height: 16px;
    background: #e2e8f0;
    border-radius: 999px;
    overflow: hidden;
  }

  .bar-chart-fill {
    height: 100%;
    background: var(--primary);
    border-radius: 999px;
    transition: width 0.3s ease;
  }

  .bar-chart-val {
    width: 45px;
    text-align: right;
    font-size: 12.5px;
    font-weight: 600;
  }

  /* Empty State */
  .empty-state {
    text-align: center;
    padding: 40px 20px;
    color: var(--text-muted);
  }

  .empty-icon {
    font-size: 32px;
    margin-bottom: 8px;
  }

  /* Responsive */
  @media (max-width: 900px) {
    .app-sidebar {
      position: fixed;
      top: var(--header-height);
      bottom: 0;
      left: 0;
      z-index: 50;
      transform: translateX(-100%);
    }
    .app-sidebar.open {
      transform: translateX(0);
      box-shadow: var(--shadow-lg);
    }
  }

  @media (min-width: 901px) {
    .app-layout.sidebar-collapsed .app-sidebar {
      display: none;
    }
  }

  /* Print */
  @media print {
    .app-header, .app-sidebar, .filters-bar, .btn, #toast-root, #modal-root {
      display: none !important;
    }
    body, .app-content {
      background: #ffffff !important;
      padding: 0 !important;
    }
    .table-container {
      border: none !important;
      box-shadow: none !important;
    }
  }
</style>
