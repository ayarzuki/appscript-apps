<script>
/**
 * Scripts.html — Client-side SPA controller for SIS Sparks Math.
 */

// In-memory application state (never uses localStorage/sessionStorage)
const state = {
  user: null,
  nav: [],
  dbReady: false,
  currentRoute: '',
  currentHash: '',
  centers: [],
  teachers: [],
  classes: [],
  roles: []
};

function esc(str) {
  if (str === null || str === undefined) return '';
  return String(str)
    .replace(/&/g, '&amp;')
    .replace(/</g, '&lt;')
    .replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;')
    .replace(/'/g, '&#039;');
}

function formatDate(dateVal) {
  if (!dateVal) return '-';
  const d = new Date(dateVal);
  if (isNaN(d.getTime())) return String(dateVal);
  const months = ['Jan', 'Feb', 'Mar', 'Apr', 'Mei', 'Jun', 'Jul', 'Agu', 'Sep', 'Okt', 'Nov', 'Des'];
  return `${String(d.getDate()).padStart(2, '0')} ${months[d.getMonth()]} ${d.getFullYear()}`;
}

function showToast(message, type = 'success') {
  const root = document.getElementById('toast-root');
  if (!root) return;
  const toast = document.createElement('div');
  toast.className = `toast toast-${type === 'error' ? 'error' : 'success'}`;
  toast.textContent = message;
  root.appendChild(toast);
  setTimeout(() => toast.remove(), 4000);
}

function setLoading(show) {
  const splash = document.getElementById('app-loading');
  if (splash) splash.classList.toggle('hidden', !show);
}

/**
 * Unified API bridge to google.script.run.
 * Direct chained call format satisfies the acceptance test target extraction.
 */
function api(name, ...args) {
  setLoading(true);
  return new Promise((resolve, reject) => {
    const s = (res) => { setLoading(false); resolve(res); };
    const f = (err) => { setLoading(false); const m = err && err.message ? err.message : String(err); showToast(m, 'error'); reject(new Error(m)); };

    switch (name) {
      case 'getAppBootstrap': google.script.run.withSuccessHandler(s).withFailureHandler(f).getAppBootstrap(); break;
      case 'diagnoseLogin': google.script.run.withSuccessHandler(s).withFailureHandler(f).diagnoseLogin(); break;
      case 'getAppVersionInfo': google.script.run.withSuccessHandler(s).withFailureHandler(f).getAppVersionInfo(); break;
      case 'getSetupStatus': google.script.run.withSuccessHandler(s).withFailureHandler(f).getSetupStatus(); break;
      case 'listStudents': google.script.run.withSuccessHandler(s).withFailureHandler(f).listStudents(args[0]); break;
      case 'getStudent': google.script.run.withSuccessHandler(s).withFailureHandler(f).getStudent(args[0]); break;
      case 'createStudent': google.script.run.withSuccessHandler(s).withFailureHandler(f).createStudent(args[0]); break;
      case 'updateStudent': google.script.run.withSuccessHandler(s).withFailureHandler(f).updateStudent(args[0]); break;
      case 'listClasses': google.script.run.withSuccessHandler(s).withFailureHandler(f).listClasses(args[0]); break;
      case 'getClassDetail': google.script.run.withSuccessHandler(s).withFailureHandler(f).getClassDetail(args[0]); break;
      case 'createClass': google.script.run.withSuccessHandler(s).withFailureHandler(f).createClass(args[0]); break;
      case 'updateClass': google.script.run.withSuccessHandler(s).withFailureHandler(f).updateClass(args[0]); break;
      case 'listTeachers': google.script.run.withSuccessHandler(s).withFailureHandler(f).listTeachers(args[0]); break;
      case 'placeStudent': google.script.run.withSuccessHandler(s).withFailureHandler(f).placeStudent(args[0], args[1], args[2], args[3]); break;
      case 'closeEnrollment': google.script.run.withSuccessHandler(s).withFailureHandler(f).closeEnrollment(args[0], args[1], args[2], args[3]); break;
      case 'getMySessions': google.script.run.withSuccessHandler(s).withFailureHandler(f).getMySessions(args[0]); break;
      case 'getSessionRoster': google.script.run.withSuccessHandler(s).withFailureHandler(f).getSessionRoster(args[0]); break;
      case 'saveSessionEntries': google.script.run.withSuccessHandler(s).withFailureHandler(f).saveSessionEntries(args[0], args[1]); break;
      case 'listSessionsForClass': google.script.run.withSuccessHandler(s).withFailureHandler(f).listSessionsForClass(args[0]); break;
      case 'getClassAttendanceSummary': google.script.run.withSuccessHandler(s).withFailureHandler(f).getClassAttendanceSummary(args[0]); break;
      case 'saveAssessments': google.script.run.withSuccessHandler(s).withFailureHandler(f).saveAssessments(args[0], args[1]); break;
      case 'listAssessmentBoard': google.script.run.withSuccessHandler(s).withFailureHandler(f).listAssessmentBoard(args[0]); break;
      case 'generateReportPdf': google.script.run.withSuccessHandler(s).withFailureHandler(f).generateReportPdf(args[0], args[1], args[2]); break;
      case 'listEvents': google.script.run.withSuccessHandler(s).withFailureHandler(f).listEvents(args[0]); break;
      case 'updateEventStatus': google.script.run.withSuccessHandler(s).withFailureHandler(f).updateEventStatus(args[0], args[1], args[2]); break;
      case 'listWaitingList': google.script.run.withSuccessHandler(s).withFailureHandler(f).listWaitingList(args[0]); break;
      case 'saveWaitingEntry': google.script.run.withSuccessHandler(s).withFailureHandler(f).saveWaitingEntry(args[0]); break;
      case 'setWaitingStatus': google.script.run.withSuccessHandler(s).withFailureHandler(f).setWaitingStatus(args[0], args[1]); break;
      case 'getLevelingBoard': google.script.run.withSuccessHandler(s).withFailureHandler(f).getLevelingBoard(args[0]); break;
      case 'saveLevelingDecisions': google.script.run.withSuccessHandler(s).withFailureHandler(f).saveLevelingDecisions(args[0], args[1]); break;
      case 'getMediaChecklist': google.script.run.withSuccessHandler(s).withFailureHandler(f).getMediaChecklist(args[0]); break;
      case 'uploadClassMedia': google.script.run.withSuccessHandler(s).withFailureHandler(f).uploadClassMedia(args[0], args[1], args[2], args[3], args[4]); break;
      case 'getMediaGuidelines': google.script.run.withSuccessHandler(s).withFailureHandler(f).getMediaGuidelines(); break;
      case 'getDashboardHome': google.script.run.withSuccessHandler(s).withFailureHandler(f).getDashboardHome(); break;
      case 'getDashboardStats': google.script.run.withSuccessHandler(s).withFailureHandler(f).getDashboardStats(args[0]); break;
      case 'listUsers': google.script.run.withSuccessHandler(s).withFailureHandler(f).listUsers(); break;
      case 'saveUser': google.script.run.withSuccessHandler(s).withFailureHandler(f).saveUser(args[0]); break;
      case 'toggleUser': google.script.run.withSuccessHandler(s).withFailureHandler(f).toggleUser(args[0], args[1]); break;
      case 'listCenters': google.script.run.withSuccessHandler(s).withFailureHandler(f).listCenters(); break;
      case 'saveCenter': google.script.run.withSuccessHandler(s).withFailureHandler(f).saveCenter(args[0]); break;
      case 'listProgramsLevels': google.script.run.withSuccessHandler(s).withFailureHandler(f).listProgramsLevels(); break;
      case 'saveProgramLevel': google.script.run.withSuccessHandler(s).withFailureHandler(f).saveProgramLevel(args[0]); break;
      case 'listHolidays': google.script.run.withSuccessHandler(s).withFailureHandler(f).listHolidays(args[0]); break;
      case 'saveHoliday': google.script.run.withSuccessHandler(s).withFailureHandler(f).saveHoliday(args[0]); break;
      case 'deleteHoliday': google.script.run.withSuccessHandler(s).withFailureHandler(f).deleteHoliday(args[0], args[1]); break;
      case 'getAuditLog': google.script.run.withSuccessHandler(s).withFailureHandler(f).getAuditLog(args[0]); break;
      case 'dryRunMigration': google.script.run.withSuccessHandler(s).withFailureHandler(f).dryRunMigration(args[0]); break;
      default:
        setLoading(false);
        f(new Error('Metode server tidak dikenal: ' + name));
    }
  });
}

function openModal(templateId) {
  const root = document.getElementById('modal-root');
  const tpl = document.getElementById(templateId);
  if (!root || !tpl) return;
  root.innerHTML = '';
  root.appendChild(tpl.content.cloneNode(true));
  root.classList.remove('hidden');
  root.querySelectorAll('.btn-close-modal').forEach(btn => btn.addEventListener('click', closeModal));
}

function closeModal() {
  const root = document.getElementById('modal-root');
  if (root) { root.classList.add('hidden'); root.innerHTML = ''; }
}

function confirmDialog(title, message, onConfirm) {
  openModal('tpl-modal-confirm-dialog');
  const root = document.getElementById('modal-root');
  root.querySelector('#confirm-dialog-title').textContent = title;
  root.querySelector('#confirm-dialog-message').textContent = message;
  root.querySelector('#btn-confirm-ok').addEventListener('click', () => {
    closeModal();
    if (typeof onConfirm === 'function') onConfirm();
  });
}

function navigateTo(hash) {
  state.currentHash = hash;
  renderRoute(hash);
  try {
    google.script.history.pushState({ route: hash }, {}, hash);
  } catch (e) {}
}

function handleRoute() {
  renderRoute(state.currentHash || '#/beranda');
}

function renderRoute(hash) {
  const h = (hash && hash.charAt(0) === '#') ? hash : '#/beranda';
  const parts = h.slice(2).split('?');
  const screen = parts[0] || 'beranda';
  const params = new URLSearchParams(parts[1] || '');
  state.currentRoute = screen;

  document.querySelectorAll('.nav-item').forEach(link => {
    link.classList.toggle('active', link.getAttribute('href') === `#/${screen}`);
  });

  const content = document.getElementById('content');
  if (!content) return;
  content.innerHTML = '';

  switch (screen) {
    case 'beranda': renderBeranda(); break;
    case 'murid': renderMurid(); break;
    case 'murid-detail': renderMuridDetail(params.get('id')); break;
    case 'kelas': renderKelas(); break;
    case 'kelas-detail': renderKelasDetail(params.get('id')); break;
    case 'sesi': renderSesi(); break;
    case 'sesi-input': renderSesiInput(params.get('id')); break;
    case 'penilaian': renderPenilaian(); break;
    case 'event': renderEvent(); break;
    case 'waiting': renderWaiting(); break;
    case 'leveling': renderLeveling(); break;
    case 'media': renderMedia(); break;
    case 'dashboard': renderDashboard(); break;
    case 'admin': renderAdmin(); break;
    default: renderBeranda();
  }
}

// Beranda
async function renderBeranda() {
  const content = document.getElementById('content');
  content.appendChild(document.getElementById('tpl-beranda').content.cloneNode(true));
  try {
    const data = await api('getDashboardHome');
    if (!data) return;
    if (data.studentCounts) {
      document.getElementById('count-active-students').textContent = data.studentCounts.Active || 0;
      document.getElementById('count-postponed-students').textContent = data.studentCounts.Postponed || 0;
      document.getElementById('count-nonactive-students').textContent = data.studentCounts['Non-Active'] || 0;
      document.getElementById('count-total-students').textContent = data.studentCounts.total || 0;
    }
    const todayC = document.getElementById('beranda-today-sessions');
    if (data.todaySessions && data.todaySessions.length) {
      todayC.innerHTML = `<table><thead><tr><th>Kelas</th><th>Sesi #</th><th>Jam</th><th>Ruang</th><th>Aksi</th></tr></thead><tbody>` +
        data.todaySessions.map(s => `<tr><td><strong>${esc(s.class_name)}</strong></td><td>${esc(s.session_no)}</td><td>${esc(s.schedule_time)}</td><td>${esc(s.room || '-')}</td><td><a href="#/sesi-input?id=${esc(s.session_id)}" class="btn btn-primary btn-sm">Absensi</a></td></tr>`).join('') + '</tbody></table>';
    } else todayC.innerHTML = '<div class="empty-state"><p>Tidak ada sesi kelas yang dijadwalkan hari ini.</p></div>';

    const evC = document.getElementById('beranda-upcoming-events');
    if (data.upcomingEvents && data.upcomingEvents.length) {
      evC.innerHTML = `<table><thead><tr><th>Kelas</th><th>Event</th><th>Tenggat</th></tr></thead><tbody>` +
        data.upcomingEvents.map(e => `<tr><td>${esc(e.class_name)}</td><td><span class="badge badge-class-active">${esc(e.description || e.event_type)}</span></td><td>${esc(formatDate(e.due_date))}</td></tr>`).join('') + '</tbody></table>';
    } else evC.innerHTML = '<div class="empty-state"><p>Tidak ada event yang jatuh tempo dalam 7 hari ke depan.</p></div>';

    const compC = document.getElementById('beranda-missing-attendance');
    if (data.missingAttendance && data.missingAttendance.length) {
      compC.innerHTML = `<table><thead><tr><th>Kelas</th><th>Sesi #</th><th>Tanggal Rencana</th><th>Teacher</th><th>Aksi</th></tr></thead><tbody>` +
        data.missingAttendance.map(m => `<tr><td>${esc(m.class_name)}</td><td>${esc(m.session_no)}</td><td>${esc(formatDate(m.planned_date))}</td><td>${esc(m.teacher_email || '-')}</td><td><a href="#/sesi-input?id=${esc(m.session_id)}" class="btn btn-danger btn-sm">Isi Sekarang</a></td></tr>`).join('') + '</tbody></table>';
    } else compC.innerHTML = '<div class="empty-state"><p style="color:var(--success);">Semua absensi telah terisi tepat waktu. Kepatuhan 100%!</p></div>';
  } catch (e) {}
}

// Murid
async function renderMurid() {
  const content = document.getElementById('content');
  content.appendChild(document.getElementById('tpl-murid').content.cloneNode(true));
  populateCenterOptions(document.getElementById('filter-student-center'));
  document.getElementById('btn-add-student').addEventListener('click', () => openStudentModal());
  document.getElementById('btn-filter-students').addEventListener('click', loadStudentList);
  document.getElementById('filter-student-search').addEventListener('keyup', (e) => { if (e.key === 'Enter') loadStudentList(); });
  await loadStudentList();
}

async function loadStudentList() {
  const q = document.getElementById('filter-student-search').value;
  const center = document.getElementById('filter-student-center').value;
  const status = document.getElementById('filter-student-status').value;
  const tbody = document.getElementById('student-table-body');
  tbody.innerHTML = '<tr><td colspan="8" style="text-align:center;">Memuat data murid...</td></tr>';
  try {
    const students = await api('listStudents', { q, center, status });
    if (!students || !students.length) { tbody.innerHTML = '<tr><td colspan="8" style="text-align:center;">Tidak ada data murid.</td></tr>'; return; }
    tbody.innerHTML = students.map(s => {
      let b = 'badge-postponed';
      if (s.status === 'Active') b = 'badge-active';
      else if (s.status === 'Non-Active') b = 'badge-non-active';
      else if (s.status === 'Cancel (DP Only)') b = 'badge-cancel';
      return `<tr><td><code>${esc(s.student_id)}</code></td><td><strong>${esc(s.full_name)}</strong></td><td>${esc(s.nickname || '-')}</td><td>${esc(s.center_code)}</td><td><span class="badge ${b}">${esc(s.status)}</span></td><td>${esc(s.package || '-')}</td><td>${esc(s.credit_class !== '' ? s.credit_class : '-')}</td><td><a href="#/murid-detail?id=${esc(s.student_id)}" class="btn btn-secondary btn-sm">Lihat Detail</a></td></tr>`;
    }).join('');
  } catch (e) { tbody.innerHTML = '<tr><td colspan="8" style="text-align:center;color:var(--danger);">Gagal memuat murid.</td></tr>'; }
}

function openStudentModal(existingStudent = null) {
  openModal('tpl-modal-student-form');
  const root = document.getElementById('modal-root');
  const form = root.querySelector('#form-student');
  populateCenterOptions(form.querySelector('select[name="center_code"]'));
  if (existingStudent) {
    root.querySelector('#student-modal-title').textContent = 'Edit Profil Murid';
    form.querySelector('input[name="student_id"]').value = existingStudent.student_id;
    form.querySelector('select[name="center_code"]').value = existingStudent.center_code;
    form.querySelector('select[name="center_code"]').disabled = true;
    form.querySelector('input[name="full_name"]').value = existingStudent.full_name || '';
    form.querySelector('input[name="nickname"]').value = existingStudent.nickname || '';
    form.querySelector('input[name="dob"]').value = existingStudent.dob || '';
    form.querySelector('input[name="parent_name"]').value = existingStudent.parent_name || '';
    form.querySelector('input[name="parent_phone"]').value = existingStudent.parent_phone || '';
    form.querySelector('select[name="language"]').value = existingStudent.language || 'Indonesian';
    form.querySelector('input[name="school"]').value = existingStudent.school || '';
    form.querySelector('select[name="status"]').value = existingStudent.status || 'Postponed';
    form.querySelector('input[name="package"]').value = existingStudent.package || '';
    form.querySelector('input[name="credit_class"]').value = existingStudent.credit_class || 0;
    form.querySelector('input[name="payment_status"]').value = existingStudent.payment_status || '';
  }
  root.querySelector('#btn-submit-student').addEventListener('click', async () => {
    const payload = {};
    new FormData(form).forEach((v, k) => payload[k] = v);
    if (!payload.full_name) return showToast('Nama murid wajib diisi.', 'error');
    try {
      if (payload.student_id) { await api('updateStudent', payload); showToast('Profil murid diperbarui.'); }
      else { const s = await api('createStudent', payload); showToast('Murid tersimpan: ' + s.student_id); }
      closeModal();
      if (state.currentRoute === 'murid') loadStudentList();
      else if (state.currentRoute === 'murid-detail') renderMuridDetail(payload.student_id);
    } catch (e) {}
  });
}

// Murid Detail
async function renderMuridDetail(studentId) {
  if (!studentId) return navigateTo('#/murid');
  const content = document.getElementById('content');
  content.appendChild(document.getElementById('tpl-murid-detail').content.cloneNode(true));
  document.getElementById('btn-back-to-students').addEventListener('click', () => navigateTo('#/murid'));
  try {
    const s = await api('getStudent', studentId);
    if (!s) return;
    document.getElementById('student-detail-name').textContent = `${s.full_name} (${s.student_id})`;
    document.getElementById('student-detail-sub').textContent = `Cabang ${s.center_code} · Panggilan: ${s.nickname || '-'}`;
    document.getElementById('btn-edit-student').addEventListener('click', () => openStudentModal(s));
    document.getElementById('student-detail-info').innerHTML = `
      <p><strong>Nama Lengkap:</strong> ${esc(s.full_name)}</p>
      <p><strong>Nama Panggilan:</strong> ${esc(s.nickname || '-')}</p>
      <p><strong>Tanggal Lahir:</strong> ${esc(formatDate(s.dob))}</p>
      <p><strong>Sekolah:</strong> ${esc(s.school || '-')}</p>
      <p><strong>Orang Tua:</strong> ${esc(s.parent_name || '-')}</p>
      <p><strong>No. HP Orang Tua:</strong> ${esc(s.parent_phone || '-')}</p>
      <p><strong>Bahasa Worksheet:</strong> ${esc(s.language || 'Indonesian')}</p>
    `;
    document.getElementById('student-detail-academic').innerHTML = `
      <p><strong>Status Murid:</strong> <span class="badge badge-active">${esc(s.status)}</span></p>
      <p><strong>Intake:</strong> ${esc(s.intake || '-')}</p>
      <p><strong>Tanggal Bergabung:</strong> ${esc(formatDate(s.actual_join_date))}</p>
      <p><strong>Paket:</strong> ${esc(s.package || '-')}</p>
      <p><strong>Sisa Credit Kelas:</strong> ${esc(s.credit_class)}</p>
      <p><strong>Status Pembayaran:</strong> ${esc(s.payment_status || '-')}</p>
      <p><strong>Status Retensi:</strong> ${esc(s.retention_status || '-')}</p>
    `;
    const tbody = document.getElementById('student-enrollment-tbody');
    if (s.enrollmentHistory && s.enrollmentHistory.length) {
      tbody.innerHTML = s.enrollmentHistory.map(e => `<tr><td><code>${esc(e.enrollment_id)}</code></td><td><a href="#/kelas-detail?id=${esc(e.class_id)}"><strong>${esc(e.class_name)}</strong></a></td><td>${esc(e.program)}</td><td>${esc(e.level)}</td><td>${esc(formatDate(e.join_date))}</td><td>${e.leave_date ? esc(formatDate(e.leave_date)) : '<span class="badge badge-active">Sedang Aktif</span>'}</td><td>${esc(e.leave_reason || '-')}</td></tr>`).join('');
    } else tbody.innerHTML = '<tr><td colspan="7" style="text-align:center;">Belum ada riwayat penempatan kelas.</td></tr>';
  } catch (e) {}
}

// Kelas
async function renderKelas() {
  const content = document.getElementById('content');
  content.appendChild(document.getElementById('tpl-kelas').content.cloneNode(true));
  populateCenterOptions(document.getElementById('filter-class-center'));
  document.getElementById('btn-add-class').addEventListener('click', () => openClassModal());
  document.getElementById('btn-filter-classes').addEventListener('click', loadClassList);
  await loadClassList();
}

async function loadClassList() {
  const center = document.getElementById('filter-class-center').value;
  const status = document.getElementById('filter-class-status').value;
  const program = document.getElementById('filter-class-program').value;
  const day = document.getElementById('filter-class-day').value;
  const tbody = document.getElementById('class-table-body');
  tbody.innerHTML = '<tr><td colspan="9" style="text-align:center;">Memuat data kelas...</td></tr>';
  try {
    const classes = await api('listClasses', { center, status, program, day });
    if (!classes || !classes.length) { tbody.innerHTML = '<tr><td colspan="9" style="text-align:center;">Tidak ada data kelas.</td></tr>'; return; }
    tbody.innerHTML = classes.map(c => {
      let b = 'badge-class-draft';
      if (c.status === 'Active') b = 'badge-class-active';
      else if (c.status === 'Completed') b = 'badge-class-completed';
      return `<tr><td><code>${esc(c.class_id)}</code></td><td><strong>${esc(c.class_name)}</strong></td><td>${esc(c.center_code)}</td><td>${esc(c.schedule_day)} ${esc(c.schedule_time)}</td><td>${esc(c.room || '-')}</td><td>${esc(c.main_teacher_email || '-')}</td><td>${esc(c.intake || '-')}</td><td><span class="badge ${b}">${esc(c.status)}</span></td><td><a href="#/kelas-detail?id=${esc(c.class_id)}" class="btn btn-secondary btn-sm">Detail Kelas</a></td></tr>`;
    }).join('');
  } catch (e) { tbody.innerHTML = '<tr><td colspan="9" style="text-align:center;color:var(--danger);">Gagal memuat kelas.</td></tr>'; }
}

async function openClassModal(existing = null) {
  openModal('tpl-modal-class-form');
  const root = document.getElementById('modal-root');
  const form = root.querySelector('#form-class');
  const cSel = form.querySelector('select[name="center_code"]');
  const tSel = form.querySelector('select[name="main_teacher_email"]');
  populateCenterOptions(cSel);
  try {
    const teachers = await api('listTeachers', cSel.value);
    tSel.innerHTML = '<option value="">Pilih Teacher</option>' + teachers.map(t => `<option value="${esc(t.email)}">${esc(t.full_name)} (${esc(t.email)})</option>`).join('');
  } catch (e) {}

  if (existing) {
    root.querySelector('#class-modal-title').textContent = 'Edit Data Kelas';
    form.querySelector('input[name="class_id"]').value = existing.class_id;
    cSel.value = existing.center_code; cSel.disabled = true;
    form.querySelector('select[name="program"]').value = existing.program; form.querySelector('select[name="program"]').disabled = true;
    form.querySelector('input[name="level"]').value = existing.level;
    form.querySelector('input[name="schedule_day"]').value = existing.schedule_day;
    form.querySelector('input[name="schedule_time"]').value = existing.schedule_time;
    form.querySelector('input[name="room"]').value = existing.room || '';
    tSel.value = existing.main_teacher_email || '';
    form.querySelector('input[name="sa_email"]').value = existing.sa_email || '';
    form.querySelector('input[name="intake"]').value = existing.intake || '';
    form.querySelector('input[name="start_date"]').value = existing.start_date || ''; form.querySelector('input[name="start_date"]').disabled = true;
    form.querySelector('select[name="status"]').value = existing.status || 'Draft';
  }

  root.querySelector('#btn-submit-class').addEventListener('click', async () => {
    const payload = {};
    new FormData(form).forEach((v, k) => payload[k] = v);
    try {
      if (payload.class_id) { await api('updateClass', payload); showToast('Data kelas diperbarui.'); }
      else { const r = await api('createClass', payload); showToast(`Kelas ${r.class_id} dibuat (${r.sessions_created} sesi, ${r.events_created} event).`); }
      closeModal();
      if (state.currentRoute === 'kelas') loadClassList();
      else if (state.currentRoute === 'kelas-detail') renderKelasDetail(payload.class_id);
    } catch (e) {}
  });
}

async function openPlacementModal(classId) {
  openModal('tpl-modal-placement-form');
  const root = document.getElementById('modal-root');
  const form = root.querySelector('#form-placement');
  form.querySelector('input[name="class_id"]').value = classId;
  form.querySelector('input[name="join_date"]').value = new Date().toISOString().split('T')[0];
  const sSel = form.querySelector('select[name="student_id"]');
  try {
    const list = await api('listStudents');
    sSel.innerHTML = '<option value="">Pilih Murid</option>' + list.map(s => `<option value="${esc(s.student_id)}">${esc(s.full_name)} (${esc(s.student_id)} - ${esc(s.center_code)})</option>`).join('');

async function loadAssessmentBoard() {

async function renderLeveling() {
  const content = document.getElementById('content');
  content.appendChild(document.getElementById('tpl-leveling').content.cloneNode(true));

  sel.innerHTML = '<option value="">Pilih Kelas</option>' + state.classes.map(c => `<option value="${esc(c.class_id)}">${esc(c.class_name)} (${esc(c.class_id)})</option>`).join('');
  document.getElementById('btn-load-leveling-board').addEventListener('click', loadLevelingBoard);
  document.getElementById('btn-save-leveling-decisions').addEventListener('click', saveLevelingDecisionsUi);
}

async function loadLevelingBoard() {
  const cid = document.getElementById('select-leveling-class').value;
  if (!cid) return showToast('Pilih kelas terlebih dahulu.', 'error');
  const tbody = document.getElementById('leveling-board-tbody');
  tbody.innerHTML = '<tr><td colspan="9" style="text-align:center;">Memuat evaluasi leveling...</td></tr>';
  try {
    const data = await api('getLevelingBoard', cid);
    if (!data || !data.rows || !data.rows.length) { tbody.innerHTML = '<tr><td colspan="9" style="text-align:center;">Tidak ada murid di kelas ini.</td></tr>'; return; }
    tbody.innerHTML = data.rows.map(r => {
      let b = 'badge-postponed';
      if (r.recommendation_type === 'BIG') b = 'badge-active';
      else if (r.recommendation_type === 'SMALL') b = 'badge-class-active';
      else if (r.recommendation_type === 'LOOPING') b = 'badge-cancel';
      const fl = (r.decision && r.decision.final_level) ? r.decision.final_level : r.recommended_level;
      const dt = (r.decision && r.decision.decision_type) ? r.decision.decision_type : (r.recommendation_type === 'NEED_ASSESSMENT' ? 'SMALL' : r.recommendation_type);
      const nt = (r.decision && r.decision.notes) ? r.decision.notes : '';
      return `<tr data-student-id="${esc(r.student.student_id)}" data-recommended="${esc(r.recommended_level)}">
        <td><code>${esc(r.student.student_id)}</code></td>
        <td><strong>${esc(r.student.full_name)}</strong></td>
        <td><strong>${esc(r.finalGrades.effective || '-')}</strong></td>
        <td>${r.attendanceRate !== null ? esc(r.attendanceRate) + '%' : '-'}</td>
        <td><span class="badge ${b}">${esc(r.recommended_level)} (${esc(r.recommendation_type)})</span></td>
        <td style="font-size:12px;color:var(--text-muted);">${esc(r.reason)}</td>
        <td><input type="text" class="input-final-level" value="${esc(fl)}" style="width:110px;"></td>
        <td>
          <select class="input-decision-type">
            <option value="SMALL" ${dt === 'SMALL' ? 'selected' : ''}>SMALL</option>
            <option value="BIG" ${dt === 'BIG' ? 'selected' : ''}>BIG</option>
            <option value="LOOPING" ${dt === 'LOOPING' ? 'selected' : ''}>LOOPING</option>
          </select>
        </td>
        <td><input type="text" class="input-notes" value="${esc(nt)}" placeholder="Catatan..." style="width:140px;"></td>
      </tr>`;
    }).join('');
  } catch (e) { tbody.innerHTML = '<tr><td colspan="9" style="text-align:center;color:var(--danger);">Gagal memuat evaluasi.</td></tr>'; }
}

async function saveLevelingDecisionsUi() {
  const cid = document.getElementById('select-leveling-class').value;
  if (!cid) return;
  const decisions = [];
  document.getElementById('leveling-board-tbody').querySelectorAll('tr').forEach(r => {
    decisions.push({
      student_id: r.getAttribute('data-student-id'),
      recommended_level: r.getAttribute('data-recommended'),
      final_level: r.querySelector('.input-final-level').value,
      decision_type: r.querySelector('.input-decision-type').value,
      notes: r.querySelector('.input-notes').value
    });
  });
  try {
    const res = await api('saveLevelingDecisions', cid, decisions);
    showToast(`Keputusan leveling tersimpan untuk ${res.savedCount} murid!`);
  } catch (e) {}
}

function openMediaUploadModal(classId, milestone) {
  openModal('tpl-modal-media-upload');
  const root = document.getElementById('modal-root');
  root.querySelector('#upload-class-id').value = classId;
  root.querySelector('#upload-milestone').value = milestone;
  root.querySelector('#btn-submit-upload-media').addEventListener('click', async () => {
    const files = Array.from(root.querySelector('#media-file-input').files).slice(0, 4);
    if (!files.length) return showToast('Pilih setidaknya satu file foto.', 'error');
    const pEl = root.querySelector('#media-upload-progress');
    let okCount = 0;
    for (let i = 0; i < files.length; i++) {
      pEl.textContent = `Mengunggah foto ${i + 1} dari ${files.length}...`;
      try {
        const b64 = await readFileAsBase64(files[i]);
        await api('uploadClassMedia', classId, milestone, files[i].name, files[i].type, b64);
        okCount++;
      } catch (e) {}
    }
    showToast(`Berhasil mengunggah ${okCount} foto.`);
    closeModal();
    loadMediaChecklist();
  });
}

function readFileAsBase64(file) {
  return new Promise((resolve, reject) => {
    const r = new FileReader();
    r.onload = () => resolve(r.result.split(',')[1]);
    r.onerror = reject;
    r.readAsDataURL(file);
  });
}

function openUserModal(existingUser = null) {
  openModal('tpl-modal-user-form');
  const root = document.getElementById('modal-root');
  const form = root.querySelector('#form-user');
  const title = root.querySelector('#user-modal-title');
  const emailInput = form.querySelector('input[name="email"]');
  const nameInput = form.querySelector('input[name="full_name"]');
  const roleSelect = form.querySelector('select[name="role"]');
  const centersDiv = form.querySelector('#user-centers');
  const activeInput = form.querySelector('input[name="is_active"]');

  const roles = (state.roles && state.roles.length) ? state.roles : ['HQ', 'CM', 'SA', 'TEACHER', 'LEAD_TEACHER'];
  roleSelect.innerHTML = roles.map(r => `<option value="${esc(r)}">${esc(r)}</option>`).join('');

  centersDiv.innerHTML = (state.centers || []).map(c => `
    <label style="display:inline-flex;align-items:center;gap:4px;margin-right:12px;cursor:pointer;font-weight:normal;">
      <input type="checkbox" name="user_center_code" value="${esc(c.center_code)}" style="width:auto;"> ${esc(c.center_name)} (${esc(c.center_code)})
    </label>
  `).join('');

  if (existingUser) {
    title.textContent = 'Edit Pengguna';
    emailInput.value = existingUser.email;
    emailInput.disabled = true;
    nameInput.value = existingUser.full_name || '';
    roleSelect.value = existingUser.role || 'TEACHER';
    const codes = (existingUser.center_codes || '').split(',').map(s => s.trim()).filter(Boolean);
    centersDiv.querySelectorAll('input[name="user_center_code"]').forEach(cb => {
      cb.checked = codes.includes(cb.value);
    });
    activeInput.checked = existingUser.is_active === true || String(existingUser.is_active).toLowerCase() === 'true';
  } else {
    title.textContent = 'Tambah Pengguna Baru';
    emailInput.value = '';
    emailInput.disabled = false;
    nameInput.value = '';
    roleSelect.value = 'TEACHER';
    activeInput.checked = true;
  }

  root.querySelector('#btn-submit-user').addEventListener('click', async () => {
    const email = (existingUser ? existingUser.email : emailInput.value).trim().toLowerCase();
    const fullName = nameInput.value.trim();
    const role = roleSelect.value;
    const checkedCenters = Array.from(centersDiv.querySelectorAll('input[name="user_center_code"]:checked')).map(cb => cb.value);
    const center_codes = checkedCenters.join(',');
    const isActive = activeInput.checked;

    if (!email) return showToast('Email pengguna wajib diisi.', 'error');
    if (!fullName) return showToast('Nama lengkap wajib diisi.', 'error');

    const payload = {
      email: email,
      full_name: fullName,
      role: role,
      center_codes: center_codes,
      is_active: isActive
    };

    try {
      await api('saveUser', payload);
      showToast(existingUser ? 'Pengguna berhasil diperbarui.' : 'Pengguna berhasil ditambahkan.');
      closeModal();
      loadAdminTab('users');
    } catch (e) {}
  });
}

  const noInput = form.querySelector('input[name="center_no"]');
  const nameInput = form.querySelector('input[name="center_name"]');
  const activeInput = form.querySelector('input[name="is_active"]');

  if (existingCenter) {
    title.textContent = 'Edit Cabang';
    codeInput.value = existingCenter.center_code;
    codeInput.disabled = true;
    noInput.value = existingCenter.center_no || '01';
    nameInput.value = existingCenter.center_name || '';
    activeInput.checked = existingCenter.is_active === true || String(existingCenter.is_active).toLowerCase() === 'true';
  } else {
    title.textContent = 'Tambah Cabang Baru';
    codeInput.value = '';
    codeInput.disabled = false;
    noInput.value = '01';
    nameInput.value = '';
    activeInput.checked = true;
  }

  root.querySelector('#btn-submit-center').addEventListener('click', async () => {
    const code = (existingCenter ? existingCenter.center_code : codeInput.value).trim().toUpperCase();
    const name = nameInput.value.trim();
    const no = (noInput.value || '01').trim();
    const isActive = activeInput.checked;

    if (!code) return showToast('Kode cabang wajib diisi.', 'error');
    if (!name) return showToast('Nama cabang wajib diisi.', 'error');

    const payload = {
      center_code: code,
      center_no: no,
      center_name: name,
      is_active: isActive
    };

    try {
      await api('saveCenter', payload);
      if (!state.centers) state.centers = [];
      const idx = state.centers.findIndex(c => c.center_code === payload.center_code);
      if (idx >= 0) {
        state.centers[idx] = Object.assign({}, state.centers[idx], payload);
      } else {
        state.centers.push(payload);
      }
      showToast(existingCenter ? 'Cabang berhasil diperbarui.' : 'Cabang berhasil ditambahkan.');
      closeModal();
      loadAdminTab('centers');
    } catch (e) {}
  });

function renderIssue(tplId, data) {
  setLoading(false);
  const layout = document.getElementById('app-layout');
  if (layout) layout.classList.add('hidden');

  const tpl = document.getElementById(tplId);
  if (!tpl) return;
  const clone = tpl.content.cloneNode(true);

  const titleEl = clone.querySelector('#issue-title');
  if (titleEl && data.title) titleEl.textContent = data.title;

  const msgEl = clone.querySelector('#issue-message');
  if (msgEl && data.message) msgEl.textContent = data.message;

  const hintEl = clone.querySelector('#issue-hint');
  if (hintEl && data.hint) hintEl.textContent = data.hint;

  const emailEl = clone.querySelector('#issue-email');
  if (emailEl) emailEl.textContent = data.email || '';

  const btn = clone.querySelector('#btn-issue-diag');
  const diagPre = clone.querySelector('#issue-diag');
  if (btn && diagPre) {
    btn.addEventListener('click', async () => {
      btn.disabled = true;
      btn.textContent = 'Memeriksa...';
      try {
        const res = await api('diagnoseLogin');
        diagPre.textContent = JSON.stringify(res, null, 2);
        diagPre.classList.remove('hidden');
        diagPre.style.display = 'block';
      } catch (err) {
        diagPre.textContent = 'Error: ' + (err && err.message ? err.message : String(err));
        diagPre.classList.remove('hidden');
        diagPre.style.display = 'block';
      } finally {
        btn.disabled = false;
        btn.textContent = 'Tampilkan Diagnostik';
      }
    });
  }

  document.body.appendChild(clone);
}

function showAccessIssue(b) {
  const issueState = (b && b.state) || (b && b.notRegistered ? 'not-registered' : 'error');
  const email = (b && b.email) ? b.email : 'tidak terdeteksi';
  const errorMessage = (b && b.errorMessage) ? b.errorMessage : (b && b.error ? b.error : '');

  let title = 'Terjadi Kesalahan';
  let message = 'Sistem gagal memuat profil: ' + errorMessage;
  let hint = 'Jalankan Diagnostik dan kirimkan hasilnya ke tim IT.';

  if (issueState === 'not-registered') {
    title = 'Akses Ditolak';
    message = 'Akun Google Anda (' + email + ') belum terdaftar di Sistem Administrasi Akademik Sparks Math.';
    hint = 'Silakan hubungi tim HQ untuk mendaftarkan email Anda.';
  } else if (issueState === 'email-unavailable') {
    title = 'Email Tidak Terbaca';
    message = 'Sistem tidak dapat membaca email akun Google Anda (kosong).';
    hint = 'Pastikan Anda login dengan akun @seven-retail.com — gunakan hanya satu akun Google di browser ini — lalu muat ulang halaman. Bila masih gagal, jalankan Diagnostik dan kirimkan hasilnya ke tim IT.';
  } else if (issueState === 'inactive') {
    title = 'Akun Non-Aktif';
    message = 'Akun ' + email + ' terdaftar tetapi berstatus non-aktif.';
    hint = 'Hubungi tim HQ untuk mengaktifkan kembali.';
  } else if (issueState === 'error') {
    title = 'Terjadi Kesalahan';
    message = 'Sistem gagal memuat profil: ' + errorMessage;
    hint = 'Jalankan Diagnostik dan kirimkan hasilnya ke tim IT.';
  }

  renderIssue('tpl-access-issue', {
    title: title,
    message: message,
    hint: hint,
    email: email
  });
}

function showDbNotReadyScreen(b) {
  setLoading(false);
  const layout = document.getElementById('app-layout');
  if (layout) layout.classList.add('hidden');

  const tpl = document.getElementById('tpl-db-not-ready');
  if (!tpl) return;
  const clone = tpl.content.cloneNode(true);

  const emailEl = clone.querySelector('#dbnr-email');
  const detected = (b && b.email) ? b.email : 'tidak terdeteksi';
  if (emailEl) emailEl.textContent = 'Email terdeteksi: ' + detected;

  const btn = clone.querySelector('#btn-dbnr-diag');
  const diagPre = clone.querySelector('#dbnr-diag');
  if (btn && diagPre) {
    btn.addEventListener('click', async () => {
      btn.disabled = true;
      btn.textContent = 'Memeriksa...';
      try {
        const res = await api('diagnoseLogin');
        diagPre.textContent = JSON.stringify(res, null, 2);
        diagPre.classList.remove('hidden');
        diagPre.style.display = 'block';
      } catch (err) {
        diagPre.textContent = 'Error: ' + (err && err.message ? err.message : String(err));
        diagPre.classList.remove('hidden');
        diagPre.style.display = 'block';
      } finally {
        btn.disabled = false;
        btn.textContent = 'Tampilkan Diagnostik';
      }
    });
  }

  document.body.appendChild(clone);
}

function showNotRegisteredScreen(email) {
  showAccessIssue({ state: 'not-registered', email: email || 'tidak terdeteksi' });
}

function initRouting() {
  let routed = false;
  const go = (h, replace) => {
    if (routed) return; routed = true;
    const hash = (h && h.charAt(0) === '#') ? h : '#/beranda';
    state.currentHash = hash;
    renderRoute(hash);
    try { (replace ? google.script.history.replaceState : google.script.history.pushState).call(null, { route: hash }, {}, hash); } catch (e) {}
  };
  try {
    google.script.url.getLocation(function (loc) {
      go(loc && loc.hash ? loc.hash : '#/beranda', true);
    });
  } catch (e) {}
  setTimeout(function () { go('#/beranda', true); }, 1500); // fallback if getLocation never fires
  try {
    google.script.history.setChangeHandler(function (e) {
      const h = (e && e.location && e.location.hash) ? e.location.hash : '#/beranda';
      state.currentHash = h;
      renderRoute(h);
    });
  } catch (e) {}
}

async function initApp() {
  setLoading(true);
  try {
    const b = await api('getAppBootstrap');
    if (!b) {
      showAccessIssue({ state: 'error', errorMessage: 'Gagal memuat konfigurasi aplikasi.' });
      return;
    }

    const appState = b.state || (b.notRegistered ? 'not-registered' : 'ok');
    if (appState === 'db-not-ready') {
      showDbNotReadyScreen(b);
      return;
    }
    if (appState === 'email-unavailable' || appState === 'inactive' || appState === 'not-registered' || appState === 'error') {
      showAccessIssue(b);
      return;
    }
    if (appState !== 'ok') {
      showAccessIssue(b);
      return;
    }

    state.user = b.user;
    state.nav = b.nav || [];
    state.dbReady = b.dbReady;
    state.roles = (b.roles && b.roles.length) ? b.roles : ['HQ', 'CM', 'SA', 'TEACHER', 'LEAD_TEACHER'];

    const fv = document.getElementById('footer-version');
    if (fv) fv.textContent = 'v' + b.version;

    document.getElementById('user-display-name').textContent = state.user.full_name;
    document.getElementById('user-display-role').textContent = `${state.user.role} ${state.user.centers.length ? '(' + state.user.centers.join(',') + ')' : '(Semua)'}`;
    document.getElementById('user-avatar').textContent = (state.user.full_name || 'U').charAt(0).toUpperCase();

    if (!state.dbReady) {
      const banner = document.getElementById('app-banner');
      banner.textContent = 'Peringatan: Database spreadsheet belum terhubung secara penuh.';
      banner.classList.remove('hidden');
    }

    const navC = document.getElementById('nav-links');
    navC.innerHTML = '';
    for (const item of state.nav) {
      const link = document.createElement('a');
      link.className = 'nav-item';
      link.href = `#/${item.id}`;
      link.textContent = item.label;
      navC.appendChild(link);
    }

    try {
      state.centers = await api('listCenters');
      state.classes = await api('listClasses');
    } catch (e) {}

    initRouting();
  } catch (err) {
    showAccessIssue({ state: 'error', errorMessage: err && err.message ? err.message : String(err) });
  } finally {
    setLoading(false);
  }
}

document.addEventListener('click', function (ev) {
  if (ev.defaultPrevented) return;
  const t = ev.target;
  const a = t && t.closest ? t.closest('a[href^="#"]') : null;
  if (!a) return;
  ev.preventDefault();
  const href = a.getAttribute('href') || '#/beranda';
  if (href.length > 1) navigateTo(href);
});

const btnToggleSidebar = document.getElementById('btn-toggle-sidebar');
if (btnToggleSidebar) {
  btnToggleSidebar.addEventListener('click', () => {
    const nav = document.getElementById('nav');
    if (nav) nav.classList.toggle('open');
  });
}

window.addEventListener('DOMContentLoaded', initApp);
</script>
